[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "google-genai>=1.50.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.28.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
